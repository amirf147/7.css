<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 30" width="14" height="30">
  <defs>
    <linearGradient id="scrollGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f8fb"/>
      <stop offset="100%" stop-color="#dce6f0"/>
    </linearGradient>
  </defs>
  <!-- Scroll Up -->
  <rect x="0.5" y="0.5" width="13" height="9" fill="url(#scrollGrad)" stroke="#abbcd1"/>
  <polygon points="7,3 4,6.5 10,6.5" fill="#4c4c4c"/>
  <!-- Scroll Down -->
  <rect x="0.5" y="10.5" width="13" height="9" fill="url(#scrollGrad)" stroke="#abbcd1"/>
  <polygon points="4,13.5 10,13.5 7,17" fill="#4c4c4c"/>
  <!-- Expand More -->
  <rect x="0.5" y="20.5" width="13" height="9" fill="url(#scrollGrad)" stroke="#abbcd1"/>
  <line x1="4" y1="23" x2="10" y2="23" stroke="#4c4c4c" stroke-width="1"/>
  <polygon points="4,24.5 10,24.5 7,27.5" fill="#4c4c4c"/>
</svg>
